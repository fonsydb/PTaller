<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">
            <i class="fas fa-credit-card me-2 text-primary"></i>SIMULACIÓN - Pasarela de Pago
        </h1>
        <a th:href="@{/payment/history}" class="btn btn-info">
            <i class="fas fa-history me-2"></i>Historial
        </a>
    </div>

    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="fas fa-lock me-2 text-success"></i>Pago Seguro</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/payment/process}" th:object="${paymentDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-credit-card me-1 text-primary"></i> Número de Tarjeta
                            </label>
                            <input type="text" class="form-control" th:field="*{cardNumber}"
                                   placeholder="1234 5678 9012 3456" maxlength="19" required>
                            <small class="text-muted">Formato: 16 dígitos</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-user me-1 text-primary"></i> Titular de la Tarjeta
                            </label>
                            <input type="text" class="form-control" th:field="*{cardHolder}"
                                   placeholder="Como aparece en la tarjeta" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-calendar me-1 text-primary"></i> Fecha Expiración
                                </label>
                                <div class="row">
                                    <div class="col-6">
                                        <input type="text" class="form-control" th:field="*{expiryMonth}"
                                               placeholder="MM" maxlength="2" required>
                                    </div>
                                    <div class="col-6">
                                        <input type="text" class="form-control" th:field="*{expiryYear}"
                                               placeholder="AA" maxlength="2" required>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-shield-alt me-1 text-primary"></i> CVV
                                </label>
                                <input type="password" class="form-control" th:field="*{cvv}"
                                       placeholder="123" maxlength="3" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-dollar-sign me-1 text-primary"></i> Cantidad
                                </label>
                                <input type="number" step="0.01" class="form-control" th:field="*{amount}"
                                       placeholder="0.00" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    <i class="fas fa-info-circle me-1 text-primary"></i> Concepto
                                </label>
                                <input type="text" class="form-control" th:field="*{description}"
                                       placeholder="Concepto del pago">
                            </div>
                        </div>

                        <div class="alert alert-info small">
                            <i class="fas fa-info-circle me-2"></i>
                            <strong>Tarjetas de Prueba:</strong><br>
                            ✅ Con terminación en <strong>PAR</strong> (0,2,4,6 u 8) → Pago aprobado<br>
                            ❌ Con terminación en<strong>IMPAR</strong> (1,3,5,7 y 9) → Pago rechazado
                        </div>

                        <button type="submit" class="btn btn-gradient w-100">
                            <i class="fas fa-lock me-2"></i>Pagar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
