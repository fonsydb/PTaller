<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">
            <i class="fas fa-history me-2 text-primary"></i>Historial de Pagos
        </h1>
        <a th:href="@{/payment}" class="btn btn-gradient">
            <i class="fas fa-plus me-2"></i>Nuevo Pago
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Transacción</th>
                        <th>Tarjeta</th>
                        <th>Titular</th>
                        <th>Cantidad</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th>Descripción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tx : ${transactions}">
                        <td th:text="${tx.id}">1</td>
                        <td><code th:text="${tx.transactionId}">TXN-XXX</code></td>
                        <td th:text="${tx.cardNumber}">**** **** **** 1234</td>
                        <td th:text="${tx.cardHolder}">Titular</td>
                        <td>$ <span th:text="${tx.amount}">0.00</span></td>
                        <td>
                                <span th:if="${tx.status == 'COMPLETED'}" class="badge bg-success">
                                    <i class="fas fa-check-circle"></i> COMPLETADO
                                </span>
                            <span th:if="${tx.status == 'FAILED'}" class="badge bg-danger">
                                    <i class="fas fa-times-circle"></i> FALLIDO
                                </span>
                            <span th:if="${tx.status == 'PENDING'}" class="badge bg-warning">
                                    <i class="fas fa-clock"></i> PENDIENTE
                                </span>
                        </td>
                        <td th:text="${#temporals.format(tx.transactionDate, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${tx.description}">-</td>
                    </tr>
                    <tr th:if="${transactions.empty}">
                        <td colspan="8" class="text-center py-4">
                            <i class="fas fa-credit-card fa-3x text-muted mb-3"></i>
                            <p>No hay transacciones registradas</p>
                            <a th:href="@{/payment}" class="btn btn-sm btn-primary">
                                Realizar primer pago
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</html>
