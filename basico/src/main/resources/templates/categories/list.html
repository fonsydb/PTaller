<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="fas fa-tags me-2 text-info"></i>
            Gestión de Categorías
        </h2>
        <a th:href="@{/categories/create}" class="btn btn-gradient">
            <i class="fas fa-plus me-2"></i>Nueva Categoría
        </a>
    </div>

    <!-- Alertas -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla de categorías -->
    <div class="table-responsive">
        <table class="table table-custom table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Productos</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.id}">1</td>
                <td>
                    <strong th:text="${category.name}">Categoría</strong>
                    <th:block th:if="${category.name == 'General'}">
                            <span class="badge bg-secondary ms-2">
                                <i class="fas fa-star me-1"></i> Por defecto
                            </span>
                    </th:block>
                </td>
                <td th:text="${category.description}">Descripción</td>
                <td>
                    <span class="badge bg-secondary" th:text="${category.products.size()}">0</span>
                </td>
                <td>
                    <!-- Si es la categoría "General", mostrar badge "Protegida" -->
                    <th:block th:if="${category.name == 'General'}">
                            <span class="badge bg-secondary">
                                <i class="fas fa-shield-alt me-1"></i> Protegida
                            </span>
                    </th:block>

                    <!-- Si NO es la categoría "General", mostrar botones -->
                    <th:block th:unless="${category.name == 'General'}">
                        <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-sm btn-warning">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                        <a th:href="@{/categories/delete/{id}(id=${category.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Estás seguro de eliminar esta categoría?')">
                            <i class="fas fa-trash"></i> Eliminar
                        </a>
                    </th:block>
                </td>
            </tr>
            <tr th:if="${categories.empty}">
                <td colspan="5" class="text-center py-4">
                    <i class="fas fa-tags fa-3x text-muted mb-3 d-block"></i>
                    No hay categorías registradas
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</html>
