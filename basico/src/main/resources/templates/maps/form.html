<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agregar Sucursal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .form-container { max-width: 600px; margin: 0 auto; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h2 { color: #333; margin-bottom: 20px; }
        .btn-back { margin-top: 20px; }
    </style>
</head>
<body>
<div class="form-container">
    <h2><i class="fas fa-store me-2 text-primary"></i>Agregar Nueva Sucursal</h2>

    <form th:action="@{/map/save}" th:object="${store}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nombre de la Sucursal *</label>
            <input type="text" class="form-control" th:field="*{name}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Dirección *</label>
            <input type="text" class="form-control" th:field="*{address}" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Latitud *</label>
                <input type="number" step="0.000001" class="form-control" th:field="*{latitude}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Longitud *</label>
                <input type="number" step="0.000001" class="form-control" th:field="*{longitude}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" th:field="*{phone}">
        </div>

        <div class="mb-3">
            <label class="form-label">Horario</label>
            <input type="text" class="form-control" th:field="*{schedule}" placeholder="Ej: Lunes a Viernes 9:00-20:00">
        </div>

        <button type="submit" class="btn btn-primary w-100">
            <i class="fas fa-save me-2"></i>Guardar Sucursal
        </button>
    </form>

    <div class="text-center btn-back">
        <a href="/map-simple" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Volver al Mapa
        </a>
    </div>
</div>
</body>
</html>
