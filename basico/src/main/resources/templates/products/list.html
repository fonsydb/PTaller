<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="fas fa-box me-2 text-success"></i>
            Gestión de Productos
        </h2>
        <a th:href="@{/products/create}" class="btn btn-gradient">
            <i class="fas fa-plus me-2"></i>Nuevo Producto
        </a>
    </div>

    <!-- Alertas -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla de productos -->
    <div class="table-responsive">
        <table class="table table-custom table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td><strong th:text="${product.name}">Producto</strong></td>
                <td th:text="${product.description}">Descripción</td>
                <td><span class="badge bg-success">$ <span th:text="${product.price}">0.00</span></span></td>
                <td th:text="${product.stock}">0</td>
                <td>
                        <span class="badge bg-info" th:text="${product.category != null ? product.category.name : 'Sin categoría'}">
                            Categoría
                        </span>
                </td>
                <td>
                    <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-warning">
                        <i class="fas fa-edit"></i> Editar
                    </a>
                    <a th:href="@{/products/delete/{id}(id=${product.id})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Estás seguro de eliminar este producto?')">
                        <i class="fas fa-trash"></i> Eliminar
                    </a>
                </td>
            </tr>
            <tr th:if="${products.empty}">
                <td colspan="7" class="text-center py-4">
                    <i class="fas fa-box fa-3x text-muted mb-3 d-block"></i>
                    No hay productos registrados
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</html>
