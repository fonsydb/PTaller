<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/products}" class="btn btn-link text-decoration-none me-3">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
        <h2 class="mb-0">
            <i class="fas fa-box me-2 text-success"></i>
            <span th:text="${product.id} != null ? 'Editar Producto' : 'Nuevo Producto'"></span>
        </h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/products/save}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Nombre del Producto *</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio *</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{price}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Stock *</label>
                        <input type="number" class="form-control" th:field="*{stock}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Categoría</label>
                        <select class="form-select" th:field="*{category.id}">
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}"
                                    th:selected="${cat.name == 'General'}"></option>
                        </select>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i> Guardar
                    </button>
                    <a th:href="@{/products}" class="btn btn-secondary">
                        <i class="fas fa-times me-2"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
